# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - left_lbr/joint_trajectory_controller
    - right_lbr/joint_trajectory_controller

  left_lbr/joint_trajectory_controller:
    type: FollowJointTrajectory
    joints:
      - left_lbr_A1
      - left_lbr_A2
      - left_lbr_A3
      - left_lbr_A4
      - left_lbr_A5
      - left_lbr_A6
      - left_lbr_A7
    action_ns: follow_joint_trajectory
    default: True
  right_lbr/joint_trajectory_controller:
    type: FollowJointTrajectory
    joints:
      - right_lbr_A1
      - right_lbr_A2
      - right_lbr_A3
      - right_lbr_A4
      - right_lbr_A5
      - right_lbr_A6
      - right_lbr_A7
    action_ns: follow_joint_trajectory
    default: True