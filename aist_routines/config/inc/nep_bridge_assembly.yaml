ros_to_nep:
  - from: /tf
    to:   Kitting/transforms
  - from: /mesh_generator/mesh
    to:   Kitting/screen_mesh
  - from: /a_motioncam/texture
    to:   Kitting/image
  - from: /help
    to:   Kitting/request_help
    type: aist_msgs/RequestHelp
  - from: /collision_marker
    to:   Kitting/collision_marker
    type: visualization_msgs/MarkerArray
  - from: /a_bot/cartesian_compliance_controller/current_pose
    to:   Kitting/actual_robot_pose
  - from: /a_bot_camera/color/image_raw
    to:   Kitting/monitor_image
  - from: /a_bot/force_torque_sensor_broadcaster/wrench
    to:   Kitting/wrench

nep_to_ros:
  - from: Kitting/pointing
    to:   /pointing
    type: aist_msgs/Pointing
  - from: Kitting/desired_robot_pose
    to:   /a_bot/cartesian_compliance_controller/target_frame
    type: geometry_msgs/PoseStamped

services:
  - name:     /robot_description_provider/get_links
    request:  Kitting/get_links
    response: Kitting/links
    type:     aist_msgs/srv/GetLinks
  - name:     /get_collision_object
    request:  Kitting/get_collision_object
    response: Kitting/collision_object
    type:     aist_msgs/srv/GetCollisionObject
  - name:     /a_bot/controller_manager/switch_controller
    request:  Kitting/switch_controller
    response: Kitting/switch_controller_ok
