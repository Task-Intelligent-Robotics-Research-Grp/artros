$(var name)_controller:
  ros__parameters:
    driver_ns:      $(var driver_ns)
    motor_id:       $(var motor_id)
    control_period: 0.010
    control_parameters:
      loosen_period:      1.0
      max_stall_speed:    0.01
      min_stall_period:   0.5
      max_noload_current: 0.03
      min_noload_period:  0.5
