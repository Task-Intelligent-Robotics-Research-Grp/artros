arms:
  a_bot:
    type:               URe
    robot_ip:           "10.66.171.40"
    default_gripper:    a_bot_gripper
    initial_controller: a_bot_scaled_joint_trajectory_controller
    consistent_controllers:
      - a_bot_motion_control_handle
    extra_consistent_controllers:
      - a_bot_force_torque_sensor_broadcaster
      - a_bot_io_and_status_controller
      - a_bot_speed_scaling_state_broadcaster
#      - a_bot_tcp_pose_broadcaster
      - a_bot_ur_configuration_controller
    inactive_controllers:
      - a_bot_joint_trajectory_controller
      - a_bot_forward_velocity_controller
      - a_bot_forward_position_controller
      - a_bot_cartesian_compliance_controller
      - a_bot_cartesian_force_controller
      - a_bot_cartesian_motion_controller
    extra_inactive_controllers:
      - a_bot_force_mode_controller
      - a_bot_passthrough_trajectory_controller
      - a_bot_freedrive_mode_controller
      - a_bot_tool_contact_controller
  b_bot:
    type:               URe
    robot_ip:           "10.66.171.41"
    default_gripper:    b_bot_gripper
    initial_controller: b_bot_scaled_joint_trajectory_controller
    consistent_controllers:
      - b_bot_motion_control_handle
    extra_consistent_controllers:
      - b_bot_force_torque_sensor_broadcaster
      - b_bot_io_and_status_controller
      - b_bot_speed_scaling_state_broadcaster
#      - b_bot_tcp_pose_broadcaster
      - b_bot_ur_configuration_controller
    inactive_controllers:
      - b_bot_joint_trajectory_controller
      - b_bot_forward_velocity_controller
      - b_bot_forward_position_controller
      - b_bot_cartesian_compliance_controller
      - b_bot_cartesian_force_controller
      - b_bot_cartesian_motion_controller
    extra_inactive_controllers:
      - b_bot_force_mode_controller
      - b_bot_passthrough_trajectory_controller
      - b_bot_freedrive_mode_controller
      - b_bot_tool_contact_controller

grippers:
  a_bot_gripper:
    type:            RobotiqGripper
    device:          robotiq_140
    driver:          urcap
    ip_or_dev:       "10.66.171.40"
    slave_id:        9
    client_args:
      max_effort:    5.0
      velocity:      0.1
  b_bot_gripper:
    type:            RobotiqGripper
    device:          robotiq_85
    driver:          urcap
    ip_or_dev:       "10.66.171.41"
    slave_id:        9
    client_args:
      max_effort:    5.0
      velocity:      0.1
  precision_tools:
    type:            DynamixelDevices
    param_file:      package://aist_fastening_tools/config/default.yaml
    grippers:
      precision_tool:
        type:        PrecisionTool
        client_args:
          base_link: precision_tool/base_link
          tip_link:  precision_tool/tip_link
  screw_tools:
    type:            DynamixelDevices
    param_file:      package://aist_fastening_tools/config/default.yaml
    grippers:
      screw_tool_m3_fastening:
        type:        ScrewTool
        motor_id:    2
      screw_tool_m4_fastening:
        type:        ScrewTool
        motor_id:    3
  suction_tools:
    type:            URioDevices
    driver_ns:       b_bot_io_and_status_controller
    param_file:      package://aist_fastening_tools/config/default.yaml
    grippers:
      screw_tool_m3:
        type:        SuctionTool
        client_args:
          base_link: screw_tool_m3/base_link
          tip_link:  screw_tool_m3/tip_link
      screw_tool_m4:
        type:        SuctionTool
        client_args:
          base_link: screw_tool_m4/base_link
          tip_link:  screw_tool_m4/tip_link
      suction_tool:
        type:        SuctionTool
        client_args:
          base_link: suction_tool/base_link
          tip_link:  suction_tool/tip_link
      base_fixture:
        type:        SuctionTool
        client_args:
          base_link: base_fixture_base_link
          tip_link:  workbench_holder_link

cameras:
  a_motioncam:
    type: PhoXiCamera
  a_bot_camera:
    type: CodedLightRealsenseCamera
  b_bot_camera:
    type: CodedLightRealsenseCamera
  live_camera:
    type: USBCamera
