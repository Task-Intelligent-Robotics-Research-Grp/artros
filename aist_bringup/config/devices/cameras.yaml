a_motioncam:
  ros__parameters:
    id:                          LTR-066
    trigger_mode:                1  # 0: Freerun, 1: Software, 2: Hardware
    intensity_scale:             0.5
    rate:                        20.0
    processing_settings:
      normals_estimation_radius: 2
    output_settings:
      send_point_cloud:          true
      send_normal_map:           true
      send_depth_map:            true
      send_confidence_map:       false
      send_texture:              true
      send_color_camera_image:   true

/live_camera/usb_cam:
  ros__parameters:
    video_device:       /dev/video-livecam
    framerate:          5.0
    io_method:          mmap
    frame_id:           live_camera_optical_frame
    pixel_format:       mjpeg2rgb  # see usb_cam/supported_formats for list of supported formats
    av_device_format:   YUV422P
    image_width:        1920
    image_height:       1080
    camera_name:        usb_cam
    camera_info_url:    package://aist_description/scenes/calib/live_camera-camera_info.yaml
    brightness:         -1
    contrast:           -1
    saturation:         -1
    sharpness:          -1
    gain: -1
    auto_white_balance: true
    white_balance:      4000
    autoexposure:       true
    exposure:           100
    autofocus:          false
    focus:              -1