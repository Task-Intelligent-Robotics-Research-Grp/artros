# Settings for ros_control control loop
hardware_control_loop:
  loop_hz: &loop_hz $(arg frequency)

# Publish all joint states ----------------------------------
joint_state_controller:
  type:         joint_state_controller/JointStateController
  publish_rate: *loop_hz

# Publish wrench ----------------------------------
force_torque_sensor_controller:
  type:         force_torque_sensor_controller/ForceTorqueSensorController
  publish_rate: *loop_hz

# Publish wrench ----------------------------------
aist_ftsensor_controller:
  type:          aist_ftsensor_controller/ForceTorqueSensorController
  publish_rate:  *loop_hz
  gravity_frame: $(arg prefix)base_link
  sensors:
    wrench:
      filter_half_order: 2
      filter_cutoff_frequency: 250
      compensate_gravity: true

# Publish speed_scaling factor
speed_scaling_state_controller:
  type:         scaled_controllers/SpeedScalingStateController
  publish_rate: *loop_hz

# Joint Trajectory Controller - position based -------------------------------
# For detailed explanations of parameter see http://wiki.ros.org/joint_trajectory_controller
scaled_pos_joint_traj_controller:
  type: position_controllers/$(arg scaled)JointTrajectoryController
  joints: &robot_joints
    - $(arg prefix)shoulder_pan_joint
    - $(arg prefix)shoulder_lift_joint
    - $(arg prefix)elbow_joint
    - $(arg prefix)wrist_1_joint
    - $(arg prefix)wrist_2_joint
    - $(arg prefix)wrist_3_joint
  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 0.05
    $(arg prefix)shoulder_pan_joint: {trajectory: 0.2, goal: 0.1}
    $(arg prefix)shoulder_lift_joint: {trajectory: 0.2, goal: 0.1}
    $(arg prefix)elbow_joint: {trajectory: 0.2, goal: 0.1}
    $(arg prefix)wrist_1_joint: {trajectory: 0.2, goal: 0.1}
    $(arg prefix)wrist_2_joint: {trajectory: 0.2, goal: 0.1}
    $(arg prefix)wrist_3_joint: {trajectory: 0.2, goal: 0.1}
  stop_trajectory_duration: 0.5
  state_publish_rate: *loop_hz
  action_monitor_rate: 20

pos_joint_traj_controller:
  type: position_controllers/JointTrajectoryController
  joints: *robot_joints
  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 0.05
    $(arg prefix)shoulder_pan_joint: {trajectory: 0.2, goal: 0.1}
    $(arg prefix)shoulder_lift_joint: {trajectory: 0.2, goal: 0.1}
    $(arg prefix)elbow_joint: {trajectory: 0.2, goal: 0.1}
    $(arg prefix)wrist_1_joint: {trajectory: 0.2, goal: 0.1}
    $(arg prefix)wrist_2_joint: {trajectory: 0.2, goal: 0.1}
    $(arg prefix)wrist_3_joint: {trajectory: 0.2, goal: 0.1}
  stop_trajectory_duration: 0.5
  state_publish_rate: *loop_hz
  action_monitor_rate: 20

scaled_vel_joint_traj_controller:
  type: velocity_controllers/$(arg scaled)JointTrajectoryController
  joints: *robot_joints
  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 0.05
    $(arg prefix)shoulder_pan_joint: {trajectory: 0.1, goal: 0.1}
    $(arg prefix)shoulder_lift_joint: {trajectory: 0.1, goal: 0.1}
    $(arg prefix)elbow_joint: {trajectory: 0.1, goal: 0.1}
    $(arg prefix)wrist_1_joint: {trajectory: 0.1, goal: 0.1}
    $(arg prefix)wrist_2_joint: {trajectory: 0.1, goal: 0.1}
    $(arg prefix)wrist_3_joint: {trajectory: 0.1, goal: 0.1}
  gains:
    #!!These values have not been optimized!!
    $(arg prefix)shoulder_pan_joint:  {p: 5.0,  i: 0.05, d: 0.1, i_clamp: 1}
    $(arg prefix)shoulder_lift_joint: {p: 5.0,  i: 0.05, d: 0.1, i_clamp: 1}
    $(arg prefix)elbow_joint:         {p: 5.0,  i: 0.05, d: 0.1, i_clamp: 1}
    $(arg prefix)wrist_1_joint:       {p: 5.0,  i: 0.05, d: 0.1, i_clamp: 1}
    $(arg prefix)wrist_2_joint:       {p: 5.0,  i: 0.05, d: 0.1, i_clamp: 1}
    $(arg prefix)wrist_3_joint:       {p: 5.0,  i: 0.05, d: 0.1, i_clamp: 1}
  # Use a feedforward term to reduce the size of PID gains
  velocity_ff:
    $(arg prefix)shoulder_pan_joint: 1.0
    $(arg prefix)shoulder_lift_joint: 1.0
    $(arg prefix)elbow_joint: 1.0
    $(arg prefix)wrist_1_joint: 1.0
    $(arg prefix)wrist_2_joint: 1.0
    $(arg prefix)wrist_3_joint: 1.0
  stop_trajectory_duration: 0.5
  state_publish_rate: *loop_hz
  action_monitor_rate: 20

