# Pass an array of joint velocities directly to the joints
joint_group_vel_controller:
  type: velocity_controllers/JointGroupVelocityController
  joints: *robot_joints

# Pass an array of joint positions directly to the joints
joint_group_pos_controller:
  type:   position_controllers/JointGroupPositionController
  joints: *robot_joints

forward_joint_traj_controller:
  type:   "pass_through_controllers/JointTrajectoryController"
  joints: *robot_joints

forward_cartesian_traj_controller:
  type:   "pass_through_controllers/CartesianTrajectoryController"
  joints: *robot_joints

twist_controller:
  type:         "ros_controllers_cartesian/TwistController"
  frame_id:     $(arg prefix)tool0_controller
  publish_rate: *loop_hz
  joints:       *robot_joints

pose_based_cartesian_traj_controller:
  type: pose_controllers/CartesianTrajectoryController

  # UR driver convention
  base:   base
  tip:    $(arg prefix)tool0_controller
  joints: *robot_joints

joint_based_cartesian_traj_controller:
  type: position_controllers/CartesianTrajectoryController

  # UR driver convention
  base:   $(arg prefix)base
  tip:    $(arg prefix)tool0
  joints: *robot_joints

robot_status_controller:
  type: industrial_robot_status_controller/IndustrialRobotStatusController
  handle_name:  industrial_robot_status_handle
  publish_rate: 10

cartesian_motion_controller:
  type:              "velocity_controllers/CartesianMotionController"
  end_effector_link: $(arg prefix)gripper_tip_link
  joints:            *robot_joints
  solver:
    error_scale: 0.5
    iterations:  1
    publish_state_feedback: true
  pd_gains:
    trans_x: {p: 10.0}
    trans_y: {p: 10.0}
    trans_z: {p: 10.0}
    rot_x:   {p:  1.0}
    rot_y:   {p:  1.0}
    rot_z:   {p:  1.0}

cartesian_force_controller:
  type:               "position_controllers/CartesianForceController"
  end_effector_link:  $(arg prefix)gripper_tip_link
  robot_base_link:    $(arg prefix)base_link
  ft_sensor_ref_link: $(arg prefix)tool0
  joints:             *robot_joints
  solver:
    error_scale: 0.0 # 0.7 is nice in contact
    iterations: 1
    publish_state_feedback: true
  pd_gains:
    trans_x: {p: 0.05}
    trans_y: {p: 0.05}
    trans_z: {p: 0.05}
    rot_x:   {p: 1.50}
    rot_y:   {p: 1.50}
    rot_z:   {p: 1.50}

cartesian_compliance_controller:
  type:                "position_controllers/CartesianComplianceController"
  end_effector_link:   $(arg prefix)gripper_tip_link
  robot_base_link:     $(arg prefix)base_link
  ft_sensor_ref_link:  $(arg prefix)tool0
  compliance_ref_link: $(arg prefix)tool0
  joints:              *robot_joints
  stiffness:  # w.r.t. compliance_ref_link
    trans_x: 500
    trans_y: 500
    trans_z: 500
    rot_x:    20
    rot_y:    20
    rot_z:    20
  solver:
    error_scale: 1.5  # up to 2.0 was nice in free space
    iterations:  1
    publish_state_feedback: true
  pd_gains:
#    trans_x: {p: 0.05}
#    trans_y: {p: 0.05}
#    trans_z: {p: 0.05}
#    rot_x:   {p: 1.5}
#    rot_y:   {p: 1.5}
#    rot_z:   {p: 1.5}
    trans_x: {p: 0.02}
    trans_y: {p: 0.02}
    trans_z: {p: 0.02}
    rot_x:   {p: 0.5}
    rot_y:   {p: 0.5}
    rot_z:   {p: 0.5}

motion_control_handle:
  type:              "cartesian_controllers/MotionControlHandle"
  end_effector_link: $(arg prefix)gripper_tip_link
  robot_base_link:   $(arg prefix)base_link
  joints:            *robot_joints
